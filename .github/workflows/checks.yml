name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r gujarati_ocr/requirements-dev.txt -r 'paramrut scrapes/requirements-dev.txt'
      - run: python -m pytest tests -q
        working-directory: gujarati_ocr
      - run: python -m pytest tests -q
        working-directory: paramrut scrapes
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gujarati_ocr/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gujarati_ocr/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
