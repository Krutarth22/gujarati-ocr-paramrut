services:
  redis:
    image: redis:alpine
    # Redis is accessible only inside the Compose network.

  backend:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OCR_API_TOKEN=${OCR_API_TOKEN:?Set OCR_API_TOKEN to a random token of at least 32 characters}
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OCR_BATCH_SIZE=5 # Change to 1 for low-RAM servers (like Oracle AMD Free Tier)
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
